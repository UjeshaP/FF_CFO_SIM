<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Forward | CFO Simulation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="landing">

        <div class="top-bar">
            <div class="logo">FINANCE FORWARD</div>
            <div class="version">CFO SIMULATION · 01</div>
        </div>

        <section class="hero">

            <div class="eyebrow">
                DECISION-MAKING SIMULATION
            </div>

            <h1>
                Think like a<br>
                <span>Chief Financial Officer.</span>
            </h1>

            <p class="intro">
                Every decision changes the company.
                Manage growth, risk, cash, and strategy
                through a series of unpredictable challenges.
            </p>

            <button class="start-button" onclick="startGame()">
                BEGIN SIMULATION
                <span>→</span>
            </button>

        </section>

        <section class="stats-preview">

            <div>
                <span>ROLE</span>
                <strong>CHIEF FINANCIAL OFFICER</strong>
            </div>

            <div>
                <span>DECISIONS</span>
                <strong>~15</strong>
            </div>

            <div>
                <span>OUTCOME</span>
                <strong>YOUR STRATEGY</strong>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
